name: Security checks

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "23 2 * * 1"

permissions:
  contents: read

jobs:
  dependency-and-code-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies and scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pip-audit bandit
      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt
      - name: Run Bandit
        run: python -m bandit -r app model main.py -ll
      - name: Scan tracked files for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}